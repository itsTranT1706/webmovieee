    <!-- Content -->

        <!-- Movie Info Section -->
        <div class="movie-info">
            <div class="poster">
                <!-- <img src="https://phim.nguonc.com/public/images/Post/8/vien-nghien-cuu-khoai-tay.jpg" alt="Movie poster"> -->
                <img src="" alt="Movie poster">
            </div>

            <div class="details">
                <h1 class="title"></h1>
                <h2 class="english-title"></h2>

                <div class="info-row">
                    <div class="info-item">
                        <i class="fas fa-star"></i>
                        <span></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-calendar"></i>
                        <span></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-film"></i>
                        <span></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-list"></i>
                        <span></span>
                    </div>
                </div>

                <div class="genre-tags">
                    <span class="tag"></span>
                    <span class="tag"></span>
                    <span class="tag"></span>
                </div>

                <div class="info-item">
                    <i class="fas fa-play-circle"></i>
                    <span></span>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="xem-ngay">
                        <i class="fas fa-play"></i>
                        Xem Ngay
                    </button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-heart"></i>
                        Yêu thích
                    </button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-plus"></i>
                        Thêm vào
                    </button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-share"></i>
                        Chia sẻ
                    </button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-comment"></i>
                        Bình luận
                    </button>
                </div>
            </div>

            <div class="rating-display">
                <div class="rating">8.0</div>
                <div style="text-align: center; margin-top: 5px; font-size: 12px;">Đánh giá</div>
            </div>
        </div>

        <div class="infor">

                </p>

            <div class = "cast">
                
            </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active">Tập phim</div>

            <div class="tab">Diễn viên</div>
            <div class="tab">Đề xuất</div>
        </div>

        <!-- Episodes Section -->
        <div class="episodes-container">
            <div class="section-header">

                </div>
            
            </div>

            <div class="episodes-grid">

            </div>

    <!-- COMMENT  -->
        <div class="container">
            <div class="comments-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-comments"></i>
                        Bình luận <span class="comment-count">(28)</span>
                    </h2>
                </div>
                
                <!-- Login form (shows when user is not logged in) -->
                <div id="login-area" class="login-prompt">
                    <p class="login-text">Vui lòng đăng nhập để bình luận</p>
                    <button id="login-btn" class="btn-cmt btn-login">
                        <i class="fab fa-google"></i>
                        Đăng nhập với Google
                    </button>
                </div>
                
                <!-- Comment form (shows when user is logged in) -->
                <div id="comment-form-area" style="display: none;">
                    <form id="comment-form" class="comment-form">
                        <textarea id="comment-input" class="comment-input" placeholder="Viết bình luận của bạn..."></textarea>
                        <div class="form-actions">
                            <div id="user-info" class="user-info">
                                <img id="user-avatar" src="/api/placeholder/32/32" alt="Avatar" class="user-avatar">
                                <span id="user-name" class="user-name">User Name</span>
                            </div>
                            <div>
                                <button type="button" id="logout-btn" class="btn-cmt btn-secondary-cmt">Đăng xuất</button>
                                <button type="submit" class="btn-cmt btn-primary-cmt">Đăng bình luận</button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <!-- Comments list -->
                <div class="comments-list" id="comments-list">
                    <!-- Comment items will be loaded here -->
                </div>
                
                <button class="loadmore-btn" id="load-more">Xem thêm bình luận</button>
            </div>
