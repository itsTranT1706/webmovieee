</head>
<body>

    <header class="site-header">
        <div class="header-container">
          <div class="header-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
              <i class="fas fa-bars"></i>
            </button>
            <a href="/" class="logo">
              <img id="logo" src="../image/logo.webp" alt="RoPhim Logo">
              <div id="style">
                <span class="logo-text">Phe<div>Phim</div></span>
                <small>Phim hay vl</small>
              </div>
            </a>
          </div>
          <!-- <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Tìm kiếm phim, diễn viên...">
                </div> -->
    
          <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z"
                fill="#8f96a3" />
            </svg>
            <input type="text" class="search-input" placeholder="Tìm kiếm phim, diễn viên...">
            <div class="suggestion-box"></div>

          <div class="nav-tabs">
    
            <div><a class="nav-tab" href="../pages/chu-de.html">Chủ Đề</a></div>
            <div><a class="nav-tab" href="../pages/danh-sach.html?nam=2025">Duyệt tìm</a></div>
            <div><a class="nav-tab" href="../pages/danh-sach.html?loai-phim=phim-le">Phim Lẻ</a></div>
            <div><a class="nav-tab" href="../pages/danh-sach.html?loai-phim=phim-bo">Phim Bộ</a></div>
            <div><a class="nav-tab" href="../pages/danh-sach.html?loai-phim=tv-shows">TV Shows</a></div>
            <div class="nav-tab country-tab">
              Quốc gia
              <div class="dropdown" id="countryDropdown">
                <div class="dropdown-title">Chọn quốc gia</div>
                <div class="countries-grid" id="countriesGrid">
                  <!-- Countries will be populated by JavaScript -->
                </div>
              </div>
            </div>
            <div><a class="nav-tab" href="#">Xem chung</a></div>
    
          </div>
    
          <div class="header-right">
            <button class="login-btn" onclick="openModal()">Đăng nhập</button>
            <div class="user-section" style="display: none;">
                <button class="user-btn" onclick="toggleDropdown()">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">User</span>
                </button>
                <div class="dropdown-login" id="userDropdown">
                  <div class="dropdown-item" onclick="showWatchHistory()">Lịch sử xem</div>
                  <div class="dropdown-item" onclick="showFavorites()">Yêu thích</div>
                  <div class="dropdown-item" onclick="showAccountInfo()">Thông tin tài khoản</div>
                  <div class="dropdown-item logout" onclick="logout()">Đăng xuất</div>
                </div>
            </div>
          </div>
        </div>
      </header>


       <!-- Modal login -->
    <div class="modal" id="authModal">
      <div class="modal-content">
          <button class="close-btn" onclick="closeModal()">&times;</button>
          
          <div class="form-container">
              <h2 class="form-title">Welcome Back!</h2>
              
              <div class="form-tabs">
                  <button class="tab-btn active" onclick="showLogin()">Login</button>
                  <button class="tab-btn" onclick="showRegister()">Register</button>
              </div>

              <div class="success-message" id="successMessage"></div>

              <!-- Login Form -->
              <form class="form active" id="loginForm">
                  <div class="form-group">
                      <label for="loginEmail">Email</label>
                      <input type="text" id="loginEmail" placeholder="Enter your username" required>
                  </div>
                  <div class="form-group">
                      <label for="loginPassword">Password</label>
                      <input type="password" id="loginPassword" placeholder="Enter your password" required>
                  </div>
                  <button type="submit" class="submit-btn">Login</button>
              </form>

              <!-- Register Form -->
              <form class="form" id="registerForm">
                  <div class="form-group">
                      <label for="registerName">Full Name</label>
                      <input type="text" id="registerName" placeholder="Enter your full name" required>
                  </div>
                  <div class="form-group">
                      <label for="registerEmail">Email</label>
                      <input type="email" id="registerEmail" placeholder="Enter your email" required>
                  </div>
                  <div class="form-group">
                      <label for="registerPassword">Password</label>
                      <input type="password" id="registerPassword" placeholder="Create a password" required>
                  </div>
                  <div class="form-group">
                      <label for="confirmPassword">Confirm Password</label>
                      <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                  </div>
                  <button type="submit" class="submit-btn">Register</button>
              </form>
          </div>
      </div>

    </div>



    <section class="interest-section">
        <h2>CHỦ ĐỀ </h2>
        <div class="category-grid">
                 
        </div>
    </section>
    <footer>
      <p>© 2025 Phe Phim vl.</p>
  </footer>
</body>

<script src="/main/script.js"></script>
</html>
